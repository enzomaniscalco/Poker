  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .header p { margin: 0; color: #8a9080; font-size: 13px; }
  .tabs { background: #161b19; border-bottom: 1px solid #2a3530; }
  .tab-row { display: flex; }
  .tab-row + .tab-row { border-top: 1px solid #1f2622; }
  .tab-btn {

  .tab-btn.active { background: #1c2220; color: #7a8a6a; border-bottom-color: #7a8a6a; }
  .content { padding: 16px; }
  .lede { color: #8a9080; font-size: 13px; margin: 0 0 16px; line-height: 1.5; }

  .table-diagram {
    background: radial-gradient(ellipse at center, #2a3530 0%, #1c2220 60%, #14181a 100%);

    margin: 0 auto 20px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .table-label { color: #5a6258; font-size: 11px; letter-spacing: 2px; }
  .seat {
    position: absolute; transform: translate(-50%,-50%);
    background: #14181a; border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; cursor: pointer;
  }

  .row {
    border-radius: 8px; padding: 12px 14px;
    cursor: pointer; margin-bottom: 8px;
  }
  .row-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .row-name { font-weight: 700; font-size: 15px; min-width: 40px; }
  .row-full { color: #8a9080; font-size: 12px; }
  .dots { display: flex; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .row-detail {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #2a3530;
  }
  .row-detail p { margin: 0 0 6px; color: #d8dbcf; font-size: 13px; }
  .row-detail span { color: #5a6258; font-size: 11px; }

  /* Hand tiers */
  .hand-card {
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
  }
  .hand-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .hand-label { font-weight: 700; font-size: 14px; }
  .hand-pos { font-size: 11px; opacity: 0.85; }
  .hand-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .chip {
    border-radius: 4px; padding: 2px 8px;
    font-size: 12px; font-weight: 600;
  }
  .hand-tip { margin: 0; color: #8a9080; font-size: 12px; }

  /* Bet sizing */
  .street-card {
    background: #161b19; border: 1px solid #2a3530;
    border-radius: 8px; overflow: hidden; margin-bottom: 12px;
  }
  .street-head {
    background: #1c2220; padding: 10px 14px;
    border-bottom: 1px solid #2a3530;
    display: flex; align-items: center; gap: 8px;
  }
  .street-name { color: #7a8a6a; font-weight: 700; font-size: 14px; }
  .rule {
    padding: 10px; margin: 8px;
    background: #14181a; border-radius: 6px; border: 1px solid #1f2622;
  }
  .rule-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 4px;
  }
  .rule-sit { color: #d8dbcf; font-size: 12px; flex: 1; padding-right: 8px; }

    color: #7a8a6a; font-weight: 700; font-size: 13px;

    margin: 0; color: #5a6258; font-size: 11px; font-style: italic;

  .phase-name { color: #7a8a6a; font-weight: 700; font-size: 14px; }

  .phase-tip-text { color: #d8dbcf; font-size: 13px; line-height: 1.5; }

    margin-top: 12px; padding: 14px;
    background: #1f180f; border: 1px solid #a06a3a55; border-radius: 8px;

  .warn-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;

    margin-top: 16px; padding: 12px;

  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);

    width: 100%; background: #161b19; border: 1px solid #2a3530;

    color: #d8dbcf; font-size: 14px;
  }

    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid #2a3530;

  .ord-cat-name {
    color: #7a8a6a; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .ord-row {
    background: #161b19; border: 1px solid #2a3530;
    border-left: 3px solid #2a3530; border-radius: 6px;
    padding: 10px 13px; cursor: pointer; margin-bottom: 5px;
  }
  .ord-row.open {
    background: #1c2220; border-color: #5a6850;
    border-left-color: #7a8a6a;
  }
  .ord-row-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .ord-term-wrap { display: flex; align-items: baseline; gap: 8px; }
  .ord-term { color: #7a8a6a; font-weight: 700; font-size: 14px; }
  .ord-full { color: #5a6258; font-size: 11px; font-style: italic; }
  .ord-toggle { color: #5a6258; font-size: 14px; }
  .ord-explain {
    margin: 8px 0 0; color: #d8dbcf; font-size: 13px;
    line-height: 1.6; border-top: 1px solid #2a3530; padding-top: 8px;
  }
  .ord-cat { margin-bottom: 18px; }

  .footer { text-align: center; padding: 16px; color: #5a6258; font-size: 11px; }

  .hidden { display: none; }
</style>
</head>

    { term: "Stack", full: "", forklaring: "Mengden chips du har foran deg." },
    { term: "Short stack", full: "", forklaring: "Liten stack – typisk under 20BB. Krever push/fold-strategi." },
    { term: "EV", full: "Expected Value", forklaring: "Forventet verdi over tid. +EV = lønnsomt. -EV = taper penger på sikt." },
    { term: "Pot odds", full: "", forklaring: "Forholdet mellom hva du må kalle og pottens størrelse. Hjelper deg avgjøre om et kall er lønnsomt." },
    { term: "Add-on", full: "", forklaring: "Mulighet til å kjøpe ekstra chips på bestemt tidspunkt. Nesten alltid lønnsomt." },
  ]},
  { kategori: "Strategi", emoji: "🧠", ord: [
    { term: "Value bet", full: "", forklaring: "Bette med sterk hånd for å få motstanderen til å betale mer." },
    { term: "Bluff", full: "", forklaring: "Bette uten god hånd, med håp om at motstanderen folder." },
    { term: "Pot control", full: "", forklaring: "Holde potten liten med en middelmådig hånd." },
    { term: "Tilt", full: "", forklaring: "Emosjonell tilstand der du spiller dårlig pga. frustrasjon. Farligste tilstanden." },
    { term: "Push/fold", full: "", forklaring: "Short stack-strategi: enten shove all-in eller fold. Ingen min-raises." },
    { term: "Board", full: "Felleskorta", forklaring: "Alle felleskorta (flop + turn + river) som alle ser." },
    { term: "Dry board", full: "", forklaring: "Board uten muligheter for straight/flush. Enklere å c-bette." },
    { term: "Wet board", full: "", forklaring: "Board med mange draw-muligheter. Vær forsiktig." },
    { term: "Draw", full: "Drawing hand", forklaring: "Hånd som trenger ett kort til for å bli sterk – f.eks. flush draw." },
    { term: "ATC", full: "Any Two Cards", forklaring: "Kan shove med hvilke som helst kort – brukes i push/fold med kort stack og sen posisjon." },
  ]},
];

// State
const state = {
  tab: "posisjon",
  activePos: null,
  search: "",
  openTerm: null,
};

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function renderPosisjon() {
  const tableHtml = `
    <div class="table-diagram">
      <span class="table-label">BORDET</span>
      ${tableSeats.map(s => `
        <div class="seat" data-seat="${s.label}" style="left:${s.x};top:${s.y};border:2px solid ${s.color};color:${s.color};">${s.label}</div>
      `).join("")}
    </div>
  `;

  const rows = positions.map(p => {
    const isActive = state.activePos === p.name;
    const dots = [1,2,3,4,5].map(i =>
      `<div class="dot" style="background:${i <= p.strength ? p.color : '#2a3530'};"></div>`
    ).join("");
    return `
      <div class="row" data-pos="${p.name}" style="background:${isActive ? '#1c2220' : '#161b19'};border:1px solid ${isActive ? p.color : '#2a3530'};border-left:4px solid ${p.color};">
        <div class="row-head">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="row-name" style="color:${p.color};">${p.name}</span>
            <span class="row-full">${p.full}</span>
          </div>
          <div class="dots">${dots}</div>
        </div>
        ${isActive ? `
          <div class="row-detail">
            <p>${escapeHtml(p.desc)}</p>
            <span>📍 ${p.seats}</span>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");

  return `
    <p class="lede">Posisjon er én av de viktigste faktorene. Jo senere du sitter, jo mer info har du.</p>
    ${tableHtml}
    <div>${rows}</div>
    <div class="info-box">
      <p>💡 <strong>Huskeregel:</strong> Sen posisjon = mer info = mer makt. Fold mer fra UTG, åpne bredt fra BTN.</p>
    </div>
  `;
}

function renderHender() {
  const cards = handGroups.map(g => `
    <div class="hand-card" style="background:${g.bg};border:1px solid ${g.color}33;border-left:4px solid ${g.color};">
      <div class="hand-head">
        <span class="hand-label" style="color:${g.color};">${g.label}</span>
        <span class="hand-pos" style="color:${g.color};">Fra: ${g.positions.join(", ")}</span>
      </div>
      <div class="hand-chips">
        ${g.hands.map(h => `<span class="chip" style="background:${g.color}22;border:1px solid ${g.color}44;color:${g.color};">${h}</span>`).join("")}
      </div>
      <p class="hand-tip">→ ${escapeHtml(g.tip)}</p>
    </div>
  `).join("");

  return `
    <p class="lede">Spill færre, sterkere hender. Det viktigste er å folde mer pre-flop.</p>
    <div>${cards}</div>
    <div class="info-box">
      <p>💡 <strong>s = suited (samme farge) · o = offsuit (ulik farge)</strong></p>
    </div>
  `;
}

function renderBet() {
  const streets = betSizing.map(s => `
    <div class="street-card">
      <div class="street-head">
        <span style="font-size:16px;">${s.icon}</span>
        <span class="street-name">${s.street}</span>
      </div>
      <div>
        ${s.rules.map(r => `
          <div class="rule">
            <div class="rule-head">
              <span class="rule-sit">${escapeHtml(r.situation)}</span>
              <span class="rule-size">${escapeHtml(r.size)}</span>
            </div>
            <p class="rule-ex">ex: ${escapeHtml(r.example)}</p>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");

  return `
    <p class="lede">Konsistente bet sizes skjuler hva du har. Ikke bet stort bare med sterke hender!</p>
    <div>${streets}</div>
    <div class="info-box">
      <p>💡 <strong>Gyllen regel:</strong> Bet det samme uavhengig av om du bluffer eller har sterk hånd.</p>
    </div>
  `;
}

function renderTurnering() {
  const phases = tournamentTips.map(p => `
    <div class="phase-card">
      <div class="phase-head">
        <span style="font-size:18px;">${p.icon}</span>
        <span class="phase-name">${p.phase}</span>
      </div>
      ${p.tips.map(t => `
        <div class="phase-tip">
          <span class="phase-tip-bullet">▶</span>
          <span class="phase-tip-text">${escapeHtml(t)}</span>
        </div>
      `).join("")}
    </div>
  `).join("");

  return `
    <p class="lede">Tilpass strategien etter fase og stack. Add-on etter 3t – ta det alltid.</p>
    <div>${phases}</div>
    <div class="warn-box">
      <div class="warn-head">
        <span>⚠️</span>
        <span class="warn-title">Smertegrense: 2 buy-ins</span>
      </div>
      <p class="warn-body">Bestem deg <strong style="color:#c08a5a;">før</strong> du setter deg ned. Emosjonell tilt er pokerspillerens fiende nummer én.</p>
    </div>
    <div class="info-box">
      <p>💡 <strong>Rask husker:</strong><br>
      · Fold er gratis. Kalle er dyrt.<br>
      · Sen posisjon = raise. Tidlig = vær forsiktig.<br>
      · Ikke show bluffer. Bet for value eller fold.</p>
    </div>
  `;
}

function renderOrdbok() {
  const q = state.search.toLowerCase().trim();
  const filtered = q.length < 2
    ? ordbok
    : ordbok
        .map(k => ({ ...k, ord: k.ord.filter(o =>
          o.term.toLowerCase().includes(q) ||
          o.full.toLowerCase().includes(q) ||
          o.forklaring.toLowerCase().includes(q)
        )}))
        .filter(k => k.ord.length > 0);

  const empty = filtered.length === 0
    ? `<div style="text-align:center;padding:40px 20px;color:#5a6258;">
         <div style="font-size:32px;margin-bottom:12px;">🃏</div>
         <p style="margin:0;font-style:italic;">Ingen treff for "${escapeHtml(state.search)}"</p>
       </div>`
    : "";

  const cats = filtered.map((kategori, ki) => `
    <div class="ord-cat">
      <div class="ord-cat-head">
        <span>${kategori.emoji}</span>
        <span class="ord-cat-name">${escapeHtml(kategori.kategori)}</span>
      </div>
      <div>
        ${kategori.ord.map((o, oi) => {
          const key = `${ki}-${oi}`;
          const isOpen = state.openTerm === key;
          return `
            <div class="ord-row ${isOpen ? "open" : ""}" data-term="${key}">
              <div class="ord-row-head">
                <div class="ord-term-wrap">
                  <span class="ord-term">${escapeHtml(o.term)}</span>
                  ${o.full ? `<span class="ord-full">${escapeHtml(o.full)}</span>` : ""}
                </div>
                <span class="ord-toggle">${isOpen ? "▴" : "▾"}</span>
              </div>
              ${isOpen ? `<p class="ord-explain">${escapeHtml(o.forklaring)}</p>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `).join("");

  return `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="Søk etter uttrykk..." value="${escapeHtml(state.search)}" />
    </div>
    ${empty}
    ${cats}
  `;
}

function render() {
  // Update tab buttons
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });

  // Render content
  const content = document.getElementById("content");
  let html = "";
  if (state.tab === "posisjon") html = renderPosisjon();
  else if (state.tab === "hender") html = renderHender();
  else if (state.tab === "bet") html = renderBet();
  else if (state.tab === "turnering") html = renderTurnering();
  else if (state.tab === "ordbok") html = renderOrdbok();
  content.innerHTML = html;

  // Re-attach handlers
  attachContentHandlers();
}

function attachContentHandlers() {
  // Position rows + table seats
  document.querySelectorAll("[data-pos]").forEach(el => {
    el.addEventListener("click", () => {
      state.activePos = state.activePos === el.dataset.pos ? null : el.dataset.pos;
      render();
    });
  });
  document.querySelectorAll("[data-seat]").forEach(el => {
    el.addEventListener("click", () => {
      state.activePos = state.activePos === el.dataset.seat ? null : el.dataset.seat;
      render();
    });
  });

  // Ordbok rows
  document.querySelectorAll("[data-term]").forEach(el => {
    el.addEventListener("click", (e) => {
      // Don't toggle if clicking the search input
      if (e.target.tagName === "INPUT") return;
      state.openTerm = state.openTerm === el.dataset.term ? null : el.dataset.term;
      render();
    });
  });

  // Search input – preserve focus and cursor
  const input = document.getElementById("search-input");
  if (input) {
    input.addEventListener("input", (e) => {
      state.search = e.target.value;
      state.openTerm = null;
      // Re-render but keep input focused
      render();
      const newInput = document.getElementById("search-input");
      if (newInput) {
        newInput.focus();
        const len = newInput.value.length;
        newInput.setSelectionRange(len, len);
      }
    });
  }
}

// Tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.tab = btn.dataset.tab;
    render();
  });
});

// Initial render
render();
</script>
</body>
</html>
